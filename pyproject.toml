[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "production-context-freshness-service"
version = "0.1.0"
description = "Temporal, provenance-aware operational context reference service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.4.0,<2",
  "pydantic>=2.11,<3",
  "typer>=0.19,<1",
  "pyyaml>=6.0,<7",
]

[project.scripts]
pcfs = "pcfs.cli:app"

[dependency-groups]
dev = [
  "hypothesis>=6.140,<7",
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pcfs"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
